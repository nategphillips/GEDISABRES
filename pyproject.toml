[project]
name = "GEDISABRES"
version = "0.2.0"
description = "A tool for simulating the rovibronic spectra of diatomic molecules."
readme = "README.md"
authors = [
    { name = "nategphillips", email = "30729007+nategphillips@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "hamilterm",
    "py3nj",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "polars>=1.44.2",
    "pyqtdarktheme>=2.1.0",
    "pyqtgraph>=0.14.0",
    "pyside6-essentials>=6.11.2",
    "scipy>=1.18.1",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
extend-select = [
    "A",
    "ARG",
    "C4",
    "C90",
    "D",
    "E",
    "FIX",
    "I",
    "N",
    "NPY",
    "PL",
    "RET",
    "SIM",
    "TC",
    "UP",
    "W",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.uv.sources]
hamilterm = { git = "ssh://git@github.com/nategphillips/Hamilterm", branch = "main" }
py3nj = { git = "ssh://git@github.com/fujiisoup/py3nj", branch = "master" }
